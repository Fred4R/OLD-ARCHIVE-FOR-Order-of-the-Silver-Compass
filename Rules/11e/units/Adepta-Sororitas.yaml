version: 3
record_type: "current_rules_crosswalk"
authority_map: "../../../AUTHORITY.md"
authority_scope: "dated current 11e rules findings for listed units"
verification_as_of: "2026-09-13"
supersedes_for:
  - "only current-rules fields explicitly verified in this file"
does_not_supersede:
  - "historical roster snapshots"
  - "project canon or continuity"
  - "unverified current rules fields"

edition: 11
faction: "Adepta Sororitas"
source_index: "../SOURCE_INDEX.md"
connected_forces: ["FORCE-1985-V946", "FORCE-3000"]

field_vocabulary:
  model_characteristics: [M, T, SV, W, LD, OC]
  ranged_weapon_characteristics: [RANGE, A, BS, S, AP, D]
  melee_weapon_characteristics: [RANGE, A, WS, S, AP, D]
  other_datasheet_fields:
    - abilities
    - keywords
    - faction_keywords
    - wargear
    - unit_composition
    - attachment_rules
    - transport_rules

status_rule: >
  Empty current fields are never interpreted as zero or absent.
  Current point schedules come from the live MFM and do not rewrite snapshot costs.

current_army_rule_context:
  Acts_of_Faith:
    source: "OFF-11E-SOB-FP-1.0"
    verification_status: "verified_current"
    gaining_miracle_dice:
      - "Gain 1 Miracle dice at the start of each battle round."
      - "Gain 1 Miracle dice each time an ADEPTA SORORITAS unit from your army is destroyed."
    note: >
      This is the current 2026 Faction Pack update. It changes the timing of the
      recurring Miracle-die gain and does not itself replace the Codex definition
      of which rolls an Act of Faith can substitute.

