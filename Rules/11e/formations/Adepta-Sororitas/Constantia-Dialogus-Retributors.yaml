command_relevant_rules:
  retributors:
    verification_status: "verified_current"
    source: "OFF-11E-SOB-FP-1.0"
    summary: >
      Storm of Retribution lets the unit re-roll Hit rolls of 1 and Wound
      rolls of 1 for ranged attacks. Against an enemy unit that has destroyed
      one or more Adepta Sororitas units from this army during the battle,
      those attacks also add 1 to Hit and Wound rolls.
  army_of_faith:
    verification_status: "partially_verified_current"
    sources:
