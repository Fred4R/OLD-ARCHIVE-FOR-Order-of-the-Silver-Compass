      - "OFF-11E-SOB-FP-1.0"
    summary: >
      Sacred Rites publicly verifies up to two Acts of Faith for the same unit
      in one phase. Divine Guidance publicly verifies a 1CP Shooting/Fight
      intervention that improves Armour Penetration and can generate a Miracle
      die after destroying enemy models.

