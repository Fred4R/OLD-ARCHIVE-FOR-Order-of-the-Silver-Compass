name: Validate repository integrity

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-validator.txt

      - name: Install validator dependency
        run: python -m pip install --requirement requirements-validator.txt

      - name: Validate repository
        run: python scripts/validate_repository.py
